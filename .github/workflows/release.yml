name: Release

# Build and publish a release whenever a version tag is pushed.
on:
  push:
    tags: ['v[0-9]*', '[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install autotools
        run: sudo apt-get update -qq && sudo apt-get install -y autoconf automake

      - name: Bootstrap
        run: autoreconf -i && ./configure

      - name: Tag must match the configured version
        run: |
          ver=$(sed -n 's/^AC_INIT(SISSIz, \([0-9.]*\),.*/\1/p' configure.ac)
          tag=${GITHUB_REF_NAME#v}
          if [ "$tag" != "$ver" ]; then
            echo "tag $GITHUB_REF_NAME does not match AC_INIT version $ver"
            exit 1
          fi

      # distcheck builds the tarball the way a user receives it and runs the
      # test suite from it, so a broken package cannot become a release
      - name: Validate and build the tarball
        run: make distcheck

      - name: Extract the changelog section for this version
        run: |
          ver=${GITHUB_REF_NAME#v}
          awk -v v="$ver" '$0 ~ "^## "v"$" {on=1; next} /^## / {on=0} on' ChangeLog.md > notes.md
          test -s notes.md || echo "See ChangeLog.md." > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" SISSIz-*.tar.gz \
            --title "SISSIz ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag
